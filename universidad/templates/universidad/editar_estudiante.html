<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Estudiante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <h2 class="mb-4">Editar Estudiante: {{ estudiante.nombre }} {{ estudiante.apellido }}</h2>

    <form method="POST" class="card card-body shadow-sm">
        {% csrf_token %}
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label">RUT</label>
                {{ form.rut }}
            </div>
            <div class="col-md-4">
                <label class="form-label">Nombre</label>
                {{ form.nombre }}
            </div>
            <div class="col-md-4">
                <label class="form-label">Apellido</label>
                {{ form.apellido }}
            </div>
            <div class="col-md-6">
                <label class="form-label">Email</label>
                {{ form.email }}
            </div>
            <div class="col-md-6">
                <label class="form-label">Carrera</label>
                {{ form.carrera }}
            </div>
        </div>
        <div class="mt-4">
            <button type="submit" class="btn btn-success">Actualizar Estudiante</button>
            <a href="{% url 'lista_estudiantes' %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>

</body>
</html>
